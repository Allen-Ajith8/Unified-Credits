<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="uceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2350"/>
      <stop offset="100%" stop-color="#050C1E"/>
    </linearGradient>
    <linearGradient id="uceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="50%" stop-color="#006A67"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="uceGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2C76"/>
      <stop offset="50%" stop-color="#00D8FF"/>
      <stop offset="100%" stop-color="#006A67"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#uceBg)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#uceGrad1)" stroke-width="14" opacity="0.7"/>

  <!-- UCE Interconnected Network Emblem -->
  <g transform="translate(0, 0)">
    <!-- Outer Shield / Network Arc -->
    <path d="M 140 150 L 140 270 C 140 375, 372 375, 372 270 L 372 150" fill="none" stroke="url(#uceGrad1)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 200 150 L 200 260 C 200 315, 312 315, 312 260 L 312 150" fill="none" stroke="url(#uceGrad2)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Central Credit Core Spark & Nodes -->
    <circle cx="256" cy="256" r="32" fill="url(#uceGrad1)" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
    
    <!-- Network Node Orbs -->
    <circle cx="140" cy="150" r="24" fill="#00D8FF"/>
    <circle cx="372" cy="150" r="24" fill="#30D158"/>
    <circle cx="200" cy="150" r="16" fill="#FFFFFF"/>
    <circle cx="312" cy="150" r="16" fill="#FFFFFF"/>

    <!-- Connecting Rays -->
    <line x1="140" y1="150" x2="256" y2="256" stroke="#00D8FF" stroke-width="6" opacity="0.8" stroke-dasharray="8 8"/>
    <line x1="372" y1="150" x2="256" y2="256" stroke="#30D158" stroke-width="6" opacity="0.8" stroke-dasharray="8 8"/>
  </g>
</svg>
